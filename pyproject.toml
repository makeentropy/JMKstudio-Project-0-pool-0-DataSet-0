[project]
name = "agent-history-dataset"
version = "0.1.0"
description = "A dataset generation pipeline for AI agent interaction histories"
requires-python = ">=3.9"
authors = [
    { name = "Dataset Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.5.0",
    "requests>=2.31.0",
    "pyarrow>=12.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.287"
]
